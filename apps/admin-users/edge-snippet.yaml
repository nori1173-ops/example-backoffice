# infra/edge/template.yaml に転記する断片（ADD-APP-GUIDE 2 章ステップ 6 / 設計 5.2・7.1）。
# admin-users は転記済みなので、下は edge テンプレートに入っている実物の写し。
#
# scripts/deploy-edge.sh も追記済み（ADMIN_USERS_API_DOMAIN_PARAM の解決と OVERRIDES への連結）。
# /example-backoffice/{env}/apps/admin-users/api-domain を読み、値があれば
# AdminUsersApiDomain=<読んだ値> を parameter_overrides に足す。
#
# samconfig.toml に SSM のキーパスを書くのは誤り。下のパラメータは Type: String なので、
# キーパスの文字列がそのまま origin の DomainName になり、API 経路が壊れる
#（SSM から解決されるのは Type: AWS::SSM::Parameter::Value<String> のパラメータだけ）。
#
# origin も behavior も「リストの要素ごとに !If」で書く。リスト全体を !If にすると、
# 後から足した behavior が他アプリの Condition に巻き込まれ、そのアプリが未デプロイのときに
# 一緒に消える（消え方によってはデプロイ失敗、または /api/{app}/* が SPA へフォールスルー）。

# --- Parameters に追加 -------------------------------------------------------
Parameters:
  AdminUsersApiDomain:
    Type: String
    Default: ""
    Description: ユーザー管理の HTTP API ドメイン（/apps/admin-users/api-domain）。空なら API 経路を作らない

# --- Conditions に追加 -------------------------------------------------------
Conditions:
  HasAdminUsersApi: !Not [!Equals [!Ref AdminUsersApiDomain, ""]]

# --- Distribution の Origins に追加 -----------------------------------------
          - !If
            - HasAdminUsersApi
            - Id: api-admin-users
              DomainName: !Ref AdminUsersApiDomain
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols:
                  - TLSv1.2
              OriginCustomHeaders:
                - HeaderName: x-origin-verify
                  HeaderValue: !Ref OriginVerifySecret
            - !Ref AWS::NoValue

# --- Distribution の CacheBehaviors に追加 ----------------------------------
# origin と同じ Condition を要素ごとに付ける（上の「2 アプリ目以降の注意」を参照）。
# FunctionAssociations（viewer-request → EdgeGuardFunction）を必ず付ける。
# 付け忘れるとこのアプリの API だけ社内 IP 制限を素通りする（設計 7.1）。
# AllowedMethods は 7 メソッドを明示する（省略すると GET / HEAD だけになり POST が 403）。
          - !If
            - HasAdminUsersApi
            - PathPattern: /api/admin-users/*
              TargetOriginId: api-admin-users
              ViewerProtocolPolicy: https-only
              AllowedMethods:
                - GET
                - HEAD
                - OPTIONS
                - PUT
                - PATCH
                - POST
                - DELETE
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
              Compress: true
              FunctionAssociations:
                - EventType: viewer-request
                  FunctionARN: !GetAtt EdgeGuardFunction.FunctionARN
            - !Ref AWS::NoValue
