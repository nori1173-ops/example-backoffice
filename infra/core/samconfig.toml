version = 0.1

[default.build.parameters]
use_container = true

[default.deploy.parameters]
stack_name = "example-backoffice-core-dev"
region = "ap-northeast-1"
s3_bucket = "example-sam-ap-northeast-1"
s3_prefix = "example-backoffice-core-dev"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
tags = "Project=example-backoffice App=core Env=dev"
parameter_overrides = "ProjectName=example-backoffice Env=dev LogLevel=DEBUG SharedLayerArn=/example-backoffice/dev/shared/layer-arn MailDomain=backoffice-dev.example-cloud.com CognitoEmailSendingAccount=DEVELOPER HostedZoneId=Z0EXAMPLEZONE0 ExamplePowertoolsLayerArn=arn:aws:lambda:ap-northeast-1:210000000001:layer:ExamplePowertoolsPython:86 PowertoolsLayerArn=arn:aws:lambda:ap-northeast-1:017000801446:layer:AWSLambdaPowertoolsPythonV3-python313-x86_64:37 OpsEmail=devA@example.co.jp"

[production.build.parameters]
use_container = true

[production.deploy.parameters]
stack_name = "example-backoffice-core-prod"
region = "ap-northeast-1"
s3_bucket = "example-sam-ap-northeast-1"
s3_prefix = "example-backoffice-core-prod"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
tags = "Project=example-backoffice App=core Env=prod"
parameter_overrides = "ProjectName=example-backoffice Env=prod LogLevel=INFO SharedLayerArn=/example-backoffice/prod/shared/layer-arn MailDomain=backoffice.example-cloud.com CognitoEmailSendingAccount=DEVELOPER HostedZoneId=Z0EXAMPLEZONE0 ExamplePowertoolsLayerArn=arn:aws:lambda:ap-northeast-1:210000000001:layer:ExamplePowertoolsPython:86 PowertoolsLayerArn=arn:aws:lambda:ap-northeast-1:017000801446:layer:AWSLambdaPowertoolsPythonV3-python313-x86_64:37 OpsEmail=devA@example.co.jp"
